# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Runs the released images from GHCR, pinned by NULIST_VERSION (a release tag without the
# leading `v`, e.g. 0.1.0). To upgrade, bump NULIST_VERSION and run `pull` then `up -d`.
#
# Optional profiles (combine freely, e.g. `--profile caddy --profile storage`):
#   caddy    bundled Caddy reverse proxy with automatic HTTPS for NUXT_PUBLIC_SITE_URL (docker/Caddyfile)
#   storage  bundled S3-compatible storage (RustFS)
#
# Without `caddy`, put your own TLS-terminating proxy in front of WEB_BIND:WEB_PORT.
# Either way, set NULIST_TRUSTED_PROXIES to the proxy's address so client IPs are read
# from X-Forwarded-For, and NUXT_PUBLIC_SITE_URL to the public https:// URL.
name: nulist-prod

x-app-env: &app-env
  NODE_ENV: production
  NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-nulist}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nulist}
  WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
  WORKFLOW_POSTGRES_URL: postgres://${POSTGRES_USER:-nulist}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nulist}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nulist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nulist}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies Drizzle migrations and bootstraps the workflow tables, then exits
  migrate:
    image: ghcr.io/angelorc/nulist-migrate:${NULIST_VERSION:?set NULIST_VERSION}
    restart: 'no'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/angelorc/nulist:${NULIST_VERSION:?set NULIST_VERSION}
    restart: unless-stopped
    environment:
      <<: *app-env
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?set NUXT_PUBLIC_SITE_URL}
      NUXT_BETTER_AUTH_SECRET: ${NUXT_BETTER_AUTH_SECRET:?set NUXT_BETTER_AUTH_SECRET}
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:?set NUXT_APP_SECRET}
      NUXT_SNS_TOPIC_ARNS: ${NUXT_SNS_TOPIC_ARNS:-}
      NULIST_TRUSTED_PROXIES: ${NULIST_TRUSTED_PROXIES:-}
      NULIST_ALLOW_PRIVATE_TARGETS: ${NULIST_ALLOW_PRIVATE_TARGETS:-false}
      NULIST_ALLOWED_TARGETS: ${NULIST_ALLOWED_TARGETS:-}
      NULIST_SMTP_HOST: ${NULIST_SMTP_HOST:-}
      NULIST_SMTP_PORT: ${NULIST_SMTP_PORT:-587}
      NULIST_S3_ENDPOINT: ${NULIST_S3_ENDPOINT:-}
      NULIST_S3_REGION: ${NULIST_S3_REGION:-us-east-1}
      NULIST_S3_BUCKET: ${NULIST_S3_BUCKET:-nulist}
      NULIST_S3_ACCESS_KEY_ID: ${NULIST_S3_ACCESS_KEY_ID:-}
      NULIST_S3_SECRET_ACCESS_KEY: ${NULIST_S3_SECRET_ACCESS_KEY:-}
      NULIST_S3_PUBLIC_URL: ${NULIST_S3_PUBLIC_URL:-}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${WORKFLOW_POSTGRES_WORKER_CONCURRENCY:-10}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${WORKFLOW_POSTGRES_MAX_POOL_SIZE:-10}
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional reverse proxy with automatic HTTPS (enable with --profile caddy).
  # Reaches `web` over the compose network, so WEB_BIND can stay on loopback.
  caddy:
    profiles: [caddy]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?set NUXT_PUBLIC_SITE_URL}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp' # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account: keep it
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # Optional self-hosted S3 (enable with --profile storage); point NULIST_S3_* at it
  s3:
    profiles: [storage]
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${NULIST_S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${NULIST_S3_SECRET_ACCESS_KEY:-}
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '${S3_BIND:-127.0.0.1}:${S3_PORT:-9000}:9000'
    volumes:
      - s3:/data

volumes:
  postgres:
  s3:
  caddy_data:
  caddy_config:
