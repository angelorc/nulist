name: nulist

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nulist
      POSTGRES_PASSWORD: nulist
      POSTGRES_DB: nulist
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nulist -d nulist']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher used as the "SMTP" provider in development (UI on :8026)
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

  # S3-compatible object storage for the file manager (console on :9001)
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: nulist
      RUSTFS_SECRET_KEY: nulist-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - s3:/data

  # AWS Emulator: local Amazon SES v2 API for the "Amazon SES API" provider. Each start writes a
  # new CA and key pair to .aws-emulator/9297/ (restart `pnpm dev` after restarting it).
  aws-emulator:
    build: ./docker/aws-emulator
    image: nulist-aws-emulator
    restart: unless-stopped
    environment:
      EMULATOR_TELEMETRY: 'off'
    ports:
      - '127.0.0.1:9297:9297'
    volumes:
      - ./.aws-emulator:/home/emulator/.aws/emulator
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-sf',
          '--cacert',
          '/home/emulator/.aws/emulator/9297/ca.pem',
          'https://127.0.0.1:9297/__admin/health'
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  s3:
