name: nulist

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nulist
      POSTGRES_PASSWORD: nulist
      POSTGRES_DB: nulist
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nulist -d nulist']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher used as the "SMTP" provider in development (UI on :8026)
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

  # S3-compatible object storage for the file manager (console on :9001)
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: nulist
      RUSTFS_SECRET_KEY: nulist-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - s3:/data

volumes:
  postgres:
  s3:
