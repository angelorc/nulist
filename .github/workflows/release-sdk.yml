name: Release SDK

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish @nulist/sdk to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          test "sdk-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != sdk-v${version}"; exit 1; }
      - run: pnpm turbo run typecheck test build --filter=@nulist/sdk
      - run: pnpm --filter @nulist/sdk publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
