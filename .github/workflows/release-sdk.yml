name: Release SDK

# Stages @nulist/sdk on every `v*` release tag; app and SDK share one version.
# The Release workflow dispatches this on the tag it creates after a version PR merges.
# Auth is npm trusted publishing (OIDC), no token. The staged version goes live only after a
# maintainer approves it with 2FA: npmjs.com > Staged Packages, or `npm stage approve <id>`.
# To (re)stage an existing tag: gh workflow run release-sdk.yml --ref vX.Y.Z
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Stage @nulist/sdk on npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches SDK version
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pnpm turbo run typecheck test build --filter=@nulist/sdk
      # `npm stage` needs npm >= 11.19; the SDK has no workspace deps, so npm can pack it as-is
      - run: npm install -g npm@11.19.1
      - run: npm stage publish --access public --provenance
        working-directory: packages/sdk
