name: Release SDK

# Publishes @nulist/sdk on every `v*` release tag; app and SDK share one version.
# To (re)publish an existing tag: gh workflow run release-sdk.yml --ref v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @nulist/sdk to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches SDK version
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pnpm turbo run typecheck test build --filter=@nulist/sdk
      - run: pnpm --filter @nulist/sdk publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
