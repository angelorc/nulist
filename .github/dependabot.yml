version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # Matches pnpm's minimumReleaseAge: skip versions published in the last few days
    cooldown:
      default-days: 3
    groups:
      # Minor and patch bumps land as one PR; majors get their own PR each
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # vue-tsc needs the TypeScript JS API, which TypeScript 7 (native compiler) no longer ships
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Kept on the majors @nuxt/ui depends on, so UTable and its composables share one copy
      - dependency-name: '@tanstack/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vueuse/*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: [/, /docker/aws-emulator]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker-compose:
        patterns: ['*']
